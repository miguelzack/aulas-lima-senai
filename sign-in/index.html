<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="/src/pages/signin/style.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="form-container">
          <h1>Welcome back!</h1>
          <p>Enter your Credentials to access your account</p>
          <form action="" method="post">
            <fieldset>
              <label for="email">Email address</label>
              <input placeholder="Enter your email" type="email" id="email" />
            </fieldset>
            <fieldset>
              <div class="title-wrapper">
                <label for="password">Password</label>
                <a href="">forgot password</a>
              </div>
              <input placeholder="Name" type="password" id="password" />
            </fieldset>
            <fieldset class="checkbox">
              <input type="checkbox" name="checkbox" id="checkbox" />
              <label for="remember">Remember for 30 days</label>
            </fieldset>
            <button class="login" type="submit">Login</button>
          </form>
          <!-- .divider>.line+p+line -->

          <div class="divider">
            <div class="line"></div>
            <p>Or</p>
            <div class="line"></div>
          </div>
          <div class="sign-wrapper">
            <button class="sign-apps">
              <img
                src="/src/assets/icons/google-icon.svg"
                alt="Logo da Google"
                class="logo-sign-button"
              />Sign in with Google
            </button>
            <button class="sign-apps">
              <img
                src="/src/assets/icons/apple-icon.svg"
                alt="Logo da Apple"
                class="logo-sign-button"
              />Sign in with Apple
            </button>
          </div>
        </div>
        <h5 id="redirect-sign-up">
          Don't have an account?
          <a href="/src/pages/signup/index.html">Sign Up</a>
        </h5>
      </section>
      <img
        src="/src/assets/images/costela-de-adao.png"
        alt="foto de uma planta costela-de-adao"
      />
    </main>
